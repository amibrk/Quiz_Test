<!DOCTYPE html>
<html>
<head>
    <title>Quiz Test</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 40px auto; }
        .question { display: none; margin-bottom: 20px; }
        .buttons { margin-top: 20px; }
        button { padding: 10px 15px; margin-right: 10px; }
    </style>
</head>
<body>

<h2>Quiz Test</h2>

<div id="user-area">
    <p>Please enter your name:</p>
    <input id="username" type="text" style="padding: 8px;">
    <button onclick="startQuiz()">Start</button>
</div>

<div id="quiz" style="display:none;"></div>

<div class="buttons" style="display:none;" id="nav-buttons">
    <button id="prevBtn" onclick="prevQuestion()" disabled>Previous</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>
    <button id="submitBtn" onclick="submitQuiz()" style="display:none;">Submit</button>
</div>

<h3 id="result"></h3>

<script>
const questions = [
    { text: "What is 2 + 2?", answers: ["3", "4", "5"], scores: [0, 1, 0] },
    { text: "Which color is the sky?", answers: ["Blue", "Green", "Red"], scores: [1, 0, 0] },
    { text: "Which fruit is yellow?", answers: ["Banana", "Apple", "Grapes"], scores: [1, 0, 0] },
    { text: "What is the capital of France?", answers: ["Paris", "Rome", "Madrid"], scores: [1, 0, 0] },
    { text: "How many days in a week?", answers: ["5", "7", "8"], scores: [0, 1, 0] }
];

let current = 0;
let selections = new Array(questions.length).fill(null);
let username = "";

function startQuiz() {
    username = document.getElementById("username").value.trim();

    if (!username) {
        alert("Please enter your name.");
        return;
    }

    document.getElementById("user-area").style.display = "none";
    document.getElementById("quiz").style.display = "block";
    document.getElementById("nav-buttons").style.display = "block";

    renderQuestion();
}

function renderQuestion() {
    const quizDiv = document.getElementById("quiz");
    const q = questions[current];

    let html = `<div class='question active'>
        <h3>Question ${current + 1} of ${questions.length}</h3>
        <p>${q.text}</p>`;

    q.answers.forEach((ans, idx) => {
        const checked = selections[current] === idx ? "checked" : "";
        html += `<label><input type="radio" name="q" value="${idx}" ${checked}> ${ans}</label><br>`;
    });

    html += "</div>";
    quizDiv.innerHTML = html;

    document.getElementById("prevBtn").disabled = current === 0;
    document.getElementById("nextBtn").style.display = current === questions.length - 1 ? "none" : "inline-block";
    document.getElementById("submitBtn").style.display = current === questions.length - 1 ? "inline-block" : "none";
}

function saveAnswer() {
    const selected = document.querySelector("input[name='q']:checked");
    if (selected) selections[current] = parseInt(selected.value);
}

function nextQuestion() {
    saveAnswer();
    if (current < questions.length - 1) {
        current++;
        renderQuestion();
    }
}

function prevQuestion() {
    saveAnswer();
    if (current > 0) {
        current--;
        renderQuestion();
    }
}

async function submitQuiz() {
    saveAnswer();

    let score = 0;
    selections.forEach((sel, idx) => {
        if (sel !== null) score += questions[idx].scores[sel];
    });

    document.getElementById("result").innerText = `Your score: ${score} / ${questions.length}`;

    // SEND TO GOOGLE SHEETS
    await fetch("", {
      method: "POST",
      body: JSON.stringify({
        username: username,
        answers: selections,
        score: score
      })
    });

    alert("Your answers were submitted!");
}
</script>

</body>
</html>
